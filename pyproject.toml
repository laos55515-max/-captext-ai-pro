[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "captext-ai-pro"
version = "1.0.0"
description = "CapText AI Pro — automatic kinetic subtitles for any audio (rap, phonk, pop, acoustic, podcast)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "numpy>=1.26",
    "librosa>=0.10",
    "av>=12.0",
    "static-ffmpeg>=2.5",
    "stable-ts>=2.17",
    "faster-whisper>=1.0",
    "demucs>=4.0",
    "torch>=2.2",
    "torchaudio>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["onnxruntime>=1.17", "lightgbm>=4.0", "spacy>=3.7"]
ffmpeg = ["static-ffmpeg>=2.5", "imageio-ffmpeg>=0.4.9"]

[project.scripts]
captext = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
